deptrac:
  paths:
    - ./src

  layers:

    - name: RamseyUuid
      collectors:
        - type: classLike
          value: ^Ramsey\\Uuid\\.*

    - name: Domain
      collectors:
        - type: classLike
          value: ^Fundrik\\Core\\Components\\[^\\]+\\Domain\\.+

    - name: Application
      collectors:
        - type: classLike
          value: ^Fundrik\\Core\\Components\\[^\\]+\\Application\\(?!Ports\\).+

    - name: ApplicationPorts
      collectors:
        - type: classLike
          value: ^Fundrik\\Core\\Components\\[^\\]+\\Application\\Ports\\.+

  ruleset:
    Domain:
      - RamseyUuid

    Application:
      - ApplicationPorts
      - Domain

    ApplicationPorts:
      - Domain
